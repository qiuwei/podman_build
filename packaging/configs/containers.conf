# Shipped by the internal podman build for Ubuntu 22.04 (jammy).
#
# We vendor this file because jammy's golang-github-containers-common is stuck
# at 0.44.4 (the podman 3.x era), while podman 4.9.x expects >= 0.57.4. Rather
# than depend on that stale package for our config, we ship our own.
#
# Local overrides go in /etc/containers/containers.conf.d/*.conf -- do not edit
# this file, it is replaced on upgrade.

[network]

# jammy has no netavark/aardvark-dns packages, and podman 4.9.x is the last
# series that still supports CNI (podman 5.0 removed it). containernetworking-
# plugins is present in jammy, so CNI it is.
network_backend = "cni"

[engine]

# Match the distro packaging: run containers in systemd scopes so `systemd-cgls`
# and resource accounting behave, and log to the journal.
cgroup_manager = "systemd"
events_logger = "journald"

# NOTE: we deliberately do not pin `runtime` here. podman will prefer crun, then
# runc. jammy ships crun 0.17 (2021) and runc 1.1.0 (2022), both older than
# podman 4.9.x itself. If container start-up misbehaves, the OCI runtime is the
# first thing to suspect -- see the "Known caveats" section of the README.
