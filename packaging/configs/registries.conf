# Shipped by the internal podman build for Ubuntu 22.04 (jammy).
#
# Vendored rather than pulled from jammy's golang-github-containers-common
# (0.44.4), which is the podman 3.x-era config and predates the format podman
# 4.9.3 expects.

# Registries searched for unqualified names like `podman pull alpine`.
unqualified-search-registries = ["docker.io"]

# "permissive" records the resolved short name, "enforcing" refuses ambiguous
# ones. permissive matches the distro default and avoids breaking existing
# workflows on upgrade from podman 3.4.4.
short-name-mode = "permissive"

# Points container pulls at the internal Nexus proxy where one exists. Add
# [[registry]] entries here if the fleet standardises on a Nexus-hosted
# registry; leaving this empty means pulls go straight to docker.io.
